# Configuración del Worker de Cloudflare. La guía paso a paso está en docs/GUIA-USUARIO.md (y docs/DESPLIEGUE.md).
#
# No edites este archivo: copia su contenido a apps/worker/wrangler.local.toml (Git lo ignora), pon ahí el database_id de tu base
# y usa siempre --config apps/worker/wrangler.local.toml. Pasos, una sola vez:
#   1) npx wrangler login
#   2) npx wrangler d1 create finanzas             -> copia el database_id que imprime
#   3) npx wrangler d1 migrations apply finanzas --remote --config apps/worker/wrangler.local.toml
#   4) npx wrangler secret put API_TOKEN --config apps/worker/wrangler.local.toml   (y lo mismo con PIN_BORRADO)
#   5) npm run web:build && npx wrangler deploy --config apps/worker/wrangler.local.toml

name = "finanzas"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# La app web (PWA) se sirve desde el mismo Worker: mismo dominio, sin CORS.
[assets]
directory = "../web/dist"
binding = "ASSETS"
# Estas rutas pasan siempre por el Worker; el resto lo sirven los archivos estáticos.
run_worker_first = ["/api/*"]

# Avisos diarios al celular (8 de la mañana en Colombia)
[triggers]
crons = ["0,30 * * * *"]

# Workers AI (gratis): ayuda a entender frases que las reglas no entienden
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "finanzas"
# Id de la base D1 "finanzas" en la cuenta (no es un secreto: solo identifica la base). Cambia este valor por el de tu propia base..
database_id = "PEGA-AQUI-EL-ID-DE-TU-BASE"
migrations_dir = "../../db/migrations"

# Los secretos (API_TOKEN y PIN_BORRADO) NO van aquí: se guardan con `wrangler secret put`.
