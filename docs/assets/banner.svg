<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Finanzas por mensajes: cuéntale tu plata al chat">
  <title>Finanzas por mensajes</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset=".5" stop-color="#10B981"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38BDF8"/><stop offset=".55" stop-color="#10B981"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="luz1" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#10B981" stop-opacity=".28"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <radialGradient id="luz2" cx=".95" cy="0" r=".7"><stop offset="0" stop-color="#38BDF8" stop-opacity=".25"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="luz3" cx=".6" cy=".1" r=".5"><stop offset="0" stop-color="#818CF8" stop-opacity=".18"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    @keyframes t0 { 0%, 0.000% { width: 0; animation-timing-function: steps(11, end); } 7.870%, 23.148% { width: 202.000px; } 23.158%, 100% { width: 0; } }
    @keyframes r0 { 0%, 7.870% { opacity: 0; transform: translateY(6px); } 10.185%, 23.148% { opacity: 1; transform: none; } 23.158%, 100% { opacity: 0; } }
    .t0 { animation: t0 21.6s linear infinite; }
    .r0 { animation: r0 21.6s linear infinite; }
    @keyframes t1 { 0%, 25.000% { width: 0; animation-timing-function: steps(18, end); } 32.870%, 48.148% { width: 328.000px; } 48.158%, 100% { width: 0; } }
    @keyframes r1 { 0%, 32.870% { opacity: 0; transform: translateY(6px); } 35.185%, 48.148% { opacity: 1; transform: none; } 48.158%, 100% { opacity: 0; } }
    .t1 { animation: t1 21.6s linear infinite; }
    .r1 { animation: r1 21.6s linear infinite; }
    @keyframes t2 { 0%, 50.000% { width: 0; animation-timing-function: steps(35, end); } 57.870%, 73.148% { width: 634.000px; } 73.158%, 100% { width: 0; } }
    @keyframes r2 { 0%, 57.870% { opacity: 0; transform: translateY(6px); } 60.185%, 73.148% { opacity: 1; transform: none; } 73.158%, 100% { opacity: 0; } }
    .t2 { animation: t2 21.6s linear infinite; }
    .r2 { animation: r2 21.6s linear infinite; }
    @keyframes t3 { 0%, 75.000% { width: 0; animation-timing-function: steps(16, end); } 82.870%, 98.148% { width: 292.000px; } 98.158%, 100% { width: 0; } }
    @keyframes r3 { 0%, 82.870% { opacity: 0; transform: translateY(6px); } 85.185%, 98.148% { opacity: 1; transform: none; } 98.158%, 100% { opacity: 0; } }
    .t3 { animation: t3 21.6s linear infinite; }
    .r3 { animation: r3 21.6s linear infinite; }
    @keyframes pulso { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .punto { animation: pulso 2.4s ease-in-out infinite; }
  </style>
  <rect width="1200" height="330" rx="26" fill="url(#fondo)"/>
  <rect width="1200" height="330" rx="26" fill="url(#luz1)"/><rect width="1200" height="330" rx="26" fill="url(#luz2)"/><rect width="1200" height="330" rx="26" fill="url(#luz3)"/>
  <rect x="1.5" y="1.5" width="1197" height="327" rx="25" fill="none" stroke="url(#borde)" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="104" font-size="56" font-weight="800" fill="url(#titulo)" letter-spacing="-1">Finanzas por mensajes</text>
    <text x="66" y="146" font-size="22" fill="#9CA9BF">Cuéntale tu plata al chat como se la contarías a alguien. Todo cuadra.</text>
  </g>
  <g transform="translate(64 0)">
    <rect x="0" y="172" width="1072" height="136" rx="18" fill="#111827" stroke="#263249" stroke-width="1.5"/>
    <circle class="punto" cx="30" cy="200" r="5" fill="#10B981"/>
    <text x="48" y="205" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" letter-spacing="1.5">ESCRIBES</text>
    
  <g>
    <clipPath id="c0-34"><rect class="t0" x="34" y="218" width="0" height="42"/></clipPath>
    <text x="34" y="252" clip-path="url(#c0-34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#F1F5FB" textLength="198" lengthAdjust="spacing">mecato 5000</text>
    <text class="r0" x="34" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8">Gasto · Mecato · $5.000 · Efectivo</text>
  </g>
  <g>
    <clipPath id="c1-34"><rect class="t1" x="34" y="218" width="0" height="42"/></clipPath>
    <text x="34" y="252" clip-path="url(#c1-34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#F1F5FB" textLength="324" lengthAdjust="spacing">presté 40000 a Ana</text>
    <text class="r1" x="34" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8">Préstamo · le prestas a Ana · $40.000</text>
  </g>
  <g>
    <clipPath id="c2-34"><rect class="t2" x="34" y="218" width="0" height="42"/></clipPath>
    <text x="34" y="252" clip-path="url(#c2-34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#F1F5FB" textLength="630" lengthAdjust="spacing">almuerzo 60000 entre Ana, Luis y yo</text>
    <text class="r2" x="34" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8">Compartido · tu parte $20.000 · ellos te deben $40.000</text>
  </g>
  <g>
    <clipPath id="c3-34"><rect class="t3" x="34" y="218" width="0" height="42"/></clipPath>
    <text x="34" y="252" clip-path="url(#c3-34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#F1F5FB" textLength="288" lengthAdjust="spacing">vendí 3 botellas</text>
    <text class="r3" x="34" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8">Venta · 3 botellas · con el precio de tu catálogo</text>
  </g>
  </g>
</svg>
